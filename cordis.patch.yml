# Development patch: loads the plugin straight from this checkout.
# Use this file for `dsh web --patch <repo>\cordis.patch.yml` (or `pnpm dsh ...`
# from the DSH repo). Relative entry names are anchored to this file, so
# ./src/index.ts becomes an absolute file URL and no profile install is needed.
# Do not use cordis.bundle.patch.yml here: its bare package name only resolves
# from an installed profile.
- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: rt-translation
      name: './src/index.ts'
      config:
        sourceLanguage: auto
        targetLanguage: zh
