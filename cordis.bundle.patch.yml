# Bundle patch installed by `dsh plugin add` / the Desktop plugin page.
# DSH reads this only after the package is installed into a profile, where the
# bare name `dsh-rt-translation` resolves from that profile's node_modules.
# Do NOT pass this file to `dsh web --patch`: use cordis.patch.yml for dev mode,
# otherwise startup reports: Cannot find package 'dsh-rt-translation'.
- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: rt-translation
      name: 'dsh-rt-translation'
      config:
        sourceLanguage: auto
        targetLanguage: zh
